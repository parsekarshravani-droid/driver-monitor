[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Allow camera on this origin only; models are static and safe to cache.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self)"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
